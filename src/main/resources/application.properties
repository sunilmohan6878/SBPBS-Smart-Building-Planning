spring.application.name=sbpbs
server.port=8080
spring.datasource.url=${SBPBS_DB_URL:jdbc:mysql://localhost:3306/sbpbs_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SBPBS_DB_USER:root}
spring.datasource.password=${SBPBS_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
